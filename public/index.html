<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MockChatGPT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>" />
  <link rel="stylesheet" href="/vendor/hljs/styles/github.min.css" media="(prefers-color-scheme: light)" />
  <link rel="stylesheet" href="/vendor/hljs/styles/github-dark.min.css" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="/app.css" />
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/vendor/hljs/highlight.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-top">
        <button id="new-chat-btn" class="sidebar-item" title="New chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <span>New chat</span>
        </button>
        <div class="sidebar-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search-input" type="text" placeholder="Search chats" />
        </div>
      </div>
      <nav id="conv-list"></nav>
      <div class="sidebar-bottom">
        <button id="settings-btn" class="sidebar-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main id="main">
      <header id="topbar">
        <button id="sidebar-toggle" title="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <div id="model-picker">
          <button id="model-badge">MockChatGPT <span id="model-label" class="model-sub">codex</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div id="model-menu" hidden>
            <div class="menu-section">Model</div>
            <button class="menu-item" data-model="">Default <span class="menu-desc">from ~/.codex config</span></button>
            <button class="menu-item" data-model="gpt-5.6-sol">gpt-5.6-sol <span class="menu-desc">fast</span></button>
            <button class="menu-item" data-model="gpt-5.6-terra">gpt-5.6-terra <span class="menu-desc">balanced</span></button>
            <button class="menu-item" data-model="gpt-5.6-luna">gpt-5.6-luna <span class="menu-desc">most capable</span></button>
            <button class="menu-item" data-model="gpt-5.6-codex">gpt-5.6-codex <span class="menu-desc">agentic coding</span></button>
            <div class="menu-custom"><input id="model-custom" type="text" placeholder="Custom model id…" /></div>
            <div class="menu-section">Reasoning effort</div>
            <button class="menu-item" data-effort="">Default</button>
            <button class="menu-item" data-effort="minimal">Minimal</button>
            <button class="menu-item" data-effort="low">Low</button>
            <button class="menu-item" data-effort="medium">Medium</button>
            <button class="menu-item" data-effort="high">High</button>
            <button class="menu-item" data-effort="xhigh">Extra high</button>
          </div>
        </div>
        <div class="topbar-spacer"></div>
      </header>

      <div id="chat-scroll">
        <div id="empty-state">
          <h1>What can I help with?</h1>
        </div>
        <div id="messages"></div>
      </div>

      <div id="composer-wrap">
        <div id="composer">
          <div id="attach-previews"></div>
          <div class="composer-row">
            <button id="attach-btn" title="Attach files">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <textarea id="prompt-input" rows="1" placeholder="Ask anything"></textarea>
            <button id="send-btn" disabled title="Send">
              <svg id="send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              <svg id="stop-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
            </button>
          </div>
        </div>
        <div id="disclaimer">MockChatGPT can make mistakes. Check important info.</div>
      </div>
      <input type="file" id="file-input" multiple hidden />
    </main>

    <!-- Settings modal -->
    <div id="modal-backdrop" hidden>
      <div id="settings-modal">
        <div class="modal-header">
          <h2>Settings</h2>
          <button id="modal-close">✕</button>
        </div>
        <div class="modal-body">
          <label class="field">
            <span>What should MockChatGPT call you?</span>
            <input id="set-nickname" type="text" placeholder="Nickname" />
          </label>
          <label class="field">
            <span>Custom instructions</span>
            <textarea id="set-instructions" rows="4" placeholder="How would you like MockChatGPT to respond?"></textarea>
          </label>
          <label class="field checkbox">
            <input id="set-memory-enabled" type="checkbox" checked />
            <span>Reference saved memories</span>
          </label>
          <label class="field">
            <span>Saved memories (memory.md)</span>
            <textarea id="set-memory" rows="6" placeholder="Nothing saved yet."></textarea>
          </label>
        </div>
        <div class="modal-footer">
          <button id="settings-save" class="primary">Save</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
